name: Agent implementation task
description: A self-contained implementation task intended for one agent, one commit, and one pull request.
title: "[Task] "
labels:
  - type:task
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain why this work is needed and link its parent Epic and relevant ADR decisions.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Depends on
      description: List blocking Issues as `- #123`, or write `None`.
      value: "None"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List only the work included in this Issue.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: State nearby work that must not be included.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable checklist items.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List exact automated commands and required manual checks.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and boundaries
      description: Note security, privacy, data migration, accessibility, or performance constraints.
    validations:
      required: true
