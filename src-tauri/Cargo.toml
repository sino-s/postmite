[package]
name = "postmite"
version = "0.1.0"
description = "A lightweight, local-first desktop API client."
authors = ["sino-s"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sino-s/postmite"
default-run = "postmite"

[lib]
name = "postmite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "postmite"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
brotli = "8"
bytes = "1"
cookie = "0.18.1"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
reqwest = { version = "0.13.4", default-features = false, features = ["brotli", "deflate", "gzip", "http2", "multipart", "rustls", "stream", "system-proxy", "zstd"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
secret-service = { version = "5.1.0", features = ["rt-tokio-crypto-rust"] }
tauri = { version = "2", features = [] }
thiserror = "2.0.19"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
ts-rs = "12.0.1"
url = "2"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
zstd = "0.13"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3.27.0"
tokio-rustls = "0.26"
