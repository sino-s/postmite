[package]
name = "postmite"
version = "0.1.0"
description = "A lightweight, local-first desktop API client."
authors = ["sino-s"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sino-s/postmite"
default-run = "postmite"

[lib]
name = "postmite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "postmite"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2.0.19"
ts-rs = "12.0.1"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
